name: Testes das contas
on:
  push:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 eslint@9 && npx playwright install --with-deps chromium
      - run: node tests/lint.js
      - run: node tests/teste.js
      - run: node tests/ideias.js
      - run: node tests/historico.js
      - run: node tests/faixa.js
      - run: node tests/saude.js
      - run: node tests/qualidade.js
      - run: node tests/cartao.js
      - run: node tests/foto.js
      - run: node tests/metodo.js
      - run: node tests/avisos.js
      - run: node tests/precos.js --sem-dados
      - run: node tests/e2.js
      - run: node tests/variacao.js --sem-dados
      - run: node tests/linha-hora.js
      - run: node tests/periodo.js
      - run: node tests/grafico-inicio.js
      - run: node tests/cambio.js
      - run: node tests/cambio-c.js
      - run: node tests/macro.js
      - run: node tests/parecer.js
      - run: node tests/banco.js
      - run: node tests/seguradora.js
      - run: node tests/financeiras.js
      - run: node tests/sethtml.js
      - run: node tests/erros.js
